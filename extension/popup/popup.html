<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CJDB 数据抓取</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 CJDB 数据抓取</h1>
    </header>

    <section class="settings">
      <label>
        <span>API Key</span>
        <input type="password" id="apiKey" placeholder="请输入 API Key">
      </label>
      <button id="saveKey" class="btn btn-primary">保存</button>
    </section>

    <hr>

    <section class="actions">
      <h2>历史文章列表</h2>
      <label>
        <span>公众号名称</span>
        <input type="text" id="mpName" placeholder="例如：小特聊fsd">
      </label>
      <label>
        <span>页码</span>
        <input type="number" id="page" value="1" min="1">
      </label>
      <button id="fetchHistory" class="btn btn-primary">获取列表</button>
    </section>

    <hr>

    <section class="actions">
      <h2>文章数据</h2>
      <label>
        <span>文章 URL</span>
        <input type="url" id="articleUrl" placeholder="https://mp.weixin.qq.com/s/xxx">
      </label>
      <button id="fetchArticle" class="btn btn-primary">获取数据</button>
    </section>

    <section class="result">
      <h3>结果</h3>
      <pre id="output">等待操作...</pre>
      <button id="copyResult" class="btn btn-secondary">复制结果</button>
    </section>
  </div>

  <script src="../scripts/stores/index.js"></script>
  <script src="../scripts/init.js"></script>
  <script src="../scripts/stores/feishu.js"></script>
  <script src="../scripts/stores/notion.js"></script>
  <script src="../scripts/validators.js"></script>
  <script src="../scripts/StorageConfig.js"></script>
  <script src="../scripts/CrawlerConfig.js"></script>
  <script src="../scripts/api.js"></script>
  <script src="../scripts/DataStore.js"></script>
  <script src="../scripts/Crawler.js"></script>
  <script src="../scripts/UI.js"></script>
  <script src="popup.js"></script>
</body>
</html>
